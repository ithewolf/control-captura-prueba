name: CONTROL Lab18C hybrid brain (NO APK)
on:
  push:
    branches: [lab18c-hybrid-brain-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hybrid-guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Test tactical guards and shared evaluation (no LLM needed)
        run: python3 -m unittest tools.test_brain_comparison_eval tools.test_lab18c_hybrid -v
      - name: Publish honest no-model status
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.brain_comparison_eval import audit
          q=json.loads(Path('lab17/open_response_20_questions.json').read_text())['questions']
          r={'architecture':'C_HYBRID','evaluation':audit([{'id':x['id'],'answer':None} for x in q]),
             'warning':'Safety unit tests only; no LLM or true strategy evaluation in Actions'}
          Path('lab18c_no_model.json').write_text(json.dumps(r,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: control-lab18c-no-model-baseline
          path: lab18c_no_model.json
          retention-days: 7
