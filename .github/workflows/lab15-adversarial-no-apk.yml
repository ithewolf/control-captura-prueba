name: CONTROL Lab15 adversarial acceptance (NO APK)
on:
  push:
    branches: [lab15-adversarial-video-acceptance-20261123]
    paths:
      - 'tools/lab15_adversarial_acceptance.py'
      - 'tools/test_lab15_adversarial_acceptance.py'
      - 'lab15/**'
      - '.github/workflows/lab15-adversarial-no-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  adversarial-evaluation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run fourteen adversarial scenarios
        run: python3 -m unittest tools.test_lab15_adversarial_acceptance -v
      - name: Produce genuine baseline acceptance report (must be BLOCKED)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.lab15_adversarial_acceptance import evaluate
          report=evaluate() # no detector/labels - honest actual state
          assert report["status"]=="BLOCKED"
          assert report["metrics"]=="NOT_MEASURED"
          Path("lab15_actual_status.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(report,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: control-lab15-adversarial-acceptance
          path: lab15_actual_status.json
          if-no-files-found: error
          retention-days: 7
