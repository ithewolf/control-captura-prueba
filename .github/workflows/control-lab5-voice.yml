name: CONTROL Lab5 voice reference tooling (synthetic fixture only)
on:
  workflow_dispatch:
  push:
    branches: [lab5-control-voice-identity]
    paths:
      - 'tools/voice_identity_reference.py'
      - 'tools/lab5_openvoice_v2.py'
      - 'lab5_voice_identity/**'
      - '.github/workflows/control-lab5-voice.yml'
permissions:
  contents: read
jobs:
  reference-tool-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install audio conversion tool
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Verify local voice candidate script is syntactically valid
        run: python -m py_compile tools/lab5_openvoice_v2.py tools/voice_identity_reference.py
      - name: Generate synthetic test voice (not user's reference)
        run: |
          mkdir -p build/lab5-fixture
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=210:sample_rate=24000:duration=5" -ac 1 build/lab5-fixture/synthetic.wav
      - name: Verify local audio preparation without private audio
        run: |
          python tools/voice_identity_reference.py --reference build/lab5-fixture/synthetic.wav --output build/lab5-fixture/out
          python -c 'import json; r=json.load(open("build/lab5-fixture/out/reference-profile.json")); assert r["duration_seconds"]>=4.9 and r["sample_rate"]==24000 and r["status"].startswith("REFERENCE PREPARED")'
      - uses: actions/upload-artifact@v4
        with:
          name: CONTROL-LAB5-SYNTHETIC-REFERENCE-TOOL-NOT-VOICE-CLONE
          path: build/lab5-fixture/out/reference-profile.json
