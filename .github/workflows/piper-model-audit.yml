name: Piper male Spanish voice model audit (not APK)
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/audit_piper_model.py'
      - '.github/workflows/piper-model-audit.yml'
permissions:
  contents: read
concurrency:
  group: piper-model-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and check Piper male Spanish test model
        run: python tools/audit_piper_model.py
      - name: Install offline speech synthesizer for Linux lab
        run: python -m pip install --disable-pip-version-check sherpa-onnx==1.12.40 soundfile numpy
      - name: Synthesize actual male sample (Linux only)
        run: python tools/synthesize_piper_sample.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONTROL-Piper-es-MX-Ald-MALE-TEST-NOT-APK
          path: |
            build/piper-voice-audit/audit.json
            build/piper-voice-audit/synthesis.json
            build/piper-voice-audit/CONTROL-Ald-MASCULINA-prueba.wav
            build/piper-voice-audit/model.tar.bz2
          if-no-files-found: warn
