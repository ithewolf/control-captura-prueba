name: CONTROL Cerebro Tactico APK

on:
  push:
    branches: [control-cerebro-tactico-v1]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Probar cerebro sin Android
        run: |
          mkdir -p /tmp/controlbrain
          javac -encoding UTF-8 -d /tmp/controlbrain \
            app/src/main/java/com/iawolf/captureprobe/TacticalBrain.java \
            app/src/main/java/com/iawolf/captureprobe/TacticalSession.java \
            app/src/main/java/com/iawolf/captureprobe/ControlBrain.java \
            app/src/test/java/com/iawolf/captureprobe/TacticalBrainTest.java \
            app/src/test/java/com/iawolf/captureprobe/TacticalSessionTest.java
          java -ea -cp /tmp/controlbrain com.iawolf.captureprobe.TacticalBrainTest
          java -ea -cp /tmp/controlbrain com.iawolf.captureprobe.TacticalSessionTest
      - uses: android-actions/setup-android@v4
      - name: Preparar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK experimental
        uses: actions/upload-artifact@v4
        with:
          name: CONTROL-Cerebro-Tactico-v1-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
