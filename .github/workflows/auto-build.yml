name: Construir APK automáticamente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Preparar SDK Android del runner
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"; fi
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Probar procesamiento de cuadros (Java)
        run: |
          mkdir -p /tmp/control-tests
          javac -d /tmp/control-tests app/src/main/java/com/iawolf/captureprobe/FrameSampler.java tests/com/iawolf/captureprobe/FrameSamplerTest.java
          java -cp /tmp/control-tests com.iawolf.captureprobe.FrameSamplerTest
      - name: Compilar
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: control-captura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
