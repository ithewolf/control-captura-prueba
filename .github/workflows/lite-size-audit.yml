name: CONTROL Lite APK footprint trial
on:
  push:
    branches: [lab3-lite-apk-footprint]
    paths:
      - 'app/**'
      - 'lite_audit/**'
      - '.github/workflows/lite-size-audit.yml'
  workflow_dispatch:
# Only one active experimental Lite build per branch: prevent Maven rate limits.
concurrency:
  group: control-lite-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  lite-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test APK analyzer offline
        run: python -m unittest discover -s lite_audit -p 'test_*.py' -v
      - name: Protect offline voice dependencies
        run: |
          python -c "import sys; sys.path.insert(0,'lite_audit'); from preflight_voice import inspect_gradle; from pprint import pprint; r=inspect_gradle('app/build.gradle'); pprint(r); sys.exit(0 if r['status']=='PASS' else 2)"
      - name: Inspect Gradle dependencies
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath
      - name: Confirm Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Verify capture sampler before APK
        run: |
          mkdir -p build/smoke
          javac -d build/smoke app/src/main/java/com/iawolf/captureprobe/FrameSampler.java tests/FrameSamplerSmokeTest.java
          java -cp build/smoke com.iawolf.captureprobe.FrameSamplerSmokeTest
      - name: Test wake-word activation with Java
        run: |
          mkdir -p build/wake
          javac -d build/wake app/src/main/java/com/iawolf/captureprobe/WakeGate.java tests/WakeGateSmokeTest.java
          java -cp build/wake com.iawolf.captureprobe.WakeGateSmokeTest
      - name: Build isolated debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee lite-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Inspect real artifact and enforce 200 MiB trial ceiling
        run: python lite_audit/apk_size_audit.py app/build/outputs/apk/debug/app-debug.apk --budget-mb 200 --output lite-size-report.json
      - name: Inventory voice model and native libraries
        if: always()
        run: |
          if test -f app/build/outputs/apk/debug/app-debug.apk; then
            python lite_audit/package_inventory.py app/build/outputs/apk/debug/app-debug.apk --budget-mib 200 --output lite-packaging-report.json
          else
            echo "APK not built; packaging audit unavailable"
          fi
      - name: Publish diagnostic APK only after successful checks
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CONTROL-Lite-EXPERIMENTAL-debug-not-v27
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CONTROL-lite-footprint-report
          path: |
            lite-size-report.json
            lite-packaging-report.json
            lite-build.log
          if-no-files-found: ignore
