name: CONTROL Lab8 - tactical reasoning and experimental APK
on:
  push:
    branches: [lab8-tactical-reasoner-20261122]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/lab8-tactical-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test tactical rules (no model, no gameplay claims)
        run: |
          mkdir -p /tmp/control-lab8-test
          javac -encoding UTF-8 -d /tmp/control-lab8-test app/src/main/java/com/iawolf/captureprobe/TacticalDecisionEngine.java tests/TacticalDecisionEngineTest.java
          java -cp /tmp/control-lab8-test TacticalDecisionEngineTest
          javac -encoding UTF-8 -d /tmp/control-lab8-test app/src/main/java/com/iawolf/captureprobe/ConversationCore.java tests/ConversationCoreTest.java
          java -cp /tmp/control-lab8-test ConversationCoreTest
          javac -encoding UTF-8 -d /tmp/control-lab8-test app/src/main/java/com/iawolf/captureprobe/GameFrameSelectionPolicy.java tests/GameFrameSelectionPolicyTest.java
          java -cp /tmp/control-lab8-test GameFrameSelectionPolicyTest
      - name: Video tool tests
        run: |
          python3 -m compileall -q tools
          python3 -m unittest discover -s tools/tests -v
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile experimental APK only
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CONTROL-Lab8-Tactical-APK-EXPERIMENTAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
