name: CONTROL lab 1 integration CI
on:
  push:
    branches: [lab1-integracion-progresiva]
    paths:
      - 'lab_hp/**'
      - '.github/workflows/control-lab-ci.yml'
  workflow_dispatch:
jobs:
  python-laboratory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline CPU dependencies
        run: python -m pip install 'numpy>=1.24,<3' 'opencv-python-headless>=4.8,<5'
      - name: Unit and integration tests
        run: |
          cd lab_hp
          python -m unittest discover -p 'test_*.py' -v
