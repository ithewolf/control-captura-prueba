plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
 namespace 'com.iawolf.captureprobe'
 compileSdk 35
 defaultConfig {
  applicationId 'com.iawolf.captureprobe'
  minSdk 29
  targetSdk 35
  versionCode 18
  versionName '0.18'
  // Avoid bundling emulator desktop ABI binaries in an APK for real ARM phones.
  // Keep ARM 32-bit support for lower-end Android devices.
  ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
 }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
}

dependencies {
 // Lab6 test-only on-device inference (no network API). A model file is imported by the user.
 implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
 // JNA is needed by Vosk; @aar artifact-only notation does not guarantee transitive resolution.
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 // LAB4 ONLY: Gradle -PpiperProbe bundles the audited sherpa-onnx AAR.
 // Never enable on the production Lite build without device validation.
 if (project.hasProperty('piperProbe')) {
  implementation files('libs/sherpa-onnx-1.12.40.aar')
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
 }
}

/*
 * The Spanish model is fetched during compilation, never during gameplay.
 * Source: https://alphacephei.com/vosk/models (Apache-2.0 model).
 * This task must complete successfully before an APK can be considered ready.
 */
android {
 sourceSets {
  main {
   assets.srcDir("$buildDir/generated/voskAssets")
  }
 }
}
tasks.register('prepareVoskSpanishModel') {
 def outputRoot=file("$buildDir/generated/voskAssets/model-es")
 outputs.dir(outputRoot)
 // A partial previous download must never count as a valid cached voice model.
 outputs.upToDateWhen {
  new File(outputRoot,'uuid').isFile() &&
  new File(outputRoot,'am').isDirectory() &&
  new File(outputRoot,'conf').isDirectory()
 }
 doLast {
  def marker=new File(outputRoot,'uuid')
  if(marker.isFile() &&
      new File(outputRoot,'am').isDirectory() &&
      new File(outputRoot,'conf').isDirectory())return
  if(marker.exists())marker.delete()
  outputRoot.mkdirs()
  def modelUrl='https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip'
  def zipFile=new File(temporaryDir,'vosk-es.zip')
  zipFile.parentFile.mkdirs()
  def connection=new URL(modelUrl).openConnection()
  connection.connectTimeout=15000
  connection.readTimeout=60000
  connection.getInputStream().withCloseable { input ->
   zipFile.withOutputStream { output -> output << input }
  }
  new java.util.zip.ZipInputStream(new FileInputStream(zipFile)).withCloseable { zis ->
   java.util.zip.ZipEntry entry
   while((entry=zis.nextEntry)!=null) {
    def relative=entry.name.replace('\\','/')
    def prefix='vosk-model-small-es-0.42/'
    if(!relative.startsWith(prefix)) {zis.closeEntry();continue}
    relative=relative.substring(prefix.length())
    if(relative.isEmpty()){zis.closeEntry();continue}
    def dest=new File(outputRoot,relative).canonicalFile
    if(!dest.toPath().startsWith(outputRoot.canonicalFile.toPath()))
      throw new GradleException('Unsafe model ZIP path: '+relative)
    if(entry.isDirectory())dest.mkdirs()
    else {
     dest.parentFile.mkdirs()
     dest.withOutputStream { stream ->
      byte[] buffer=new byte[8192]
      int read
      while((read=zis.read(buffer))!=-1)stream.write(buffer,0,read)
     }
    }
    zis.closeEntry()
   }
  }
  if(!new File(outputRoot,'am').isDirectory()||!new File(outputRoot,'conf').isDirectory())
   throw new GradleException('Spanish Vosk model download is incomplete')
  marker.text='vosk-model-small-es-0.42'
 }
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareVoskSpanishModel') }
/*
 * LAB4 isolation: the bundled Piper model is opt-in and is never included in
 * the stable Lite branch. This does not yet hook the model to Android playback.
 */
if (project.hasProperty('piperProbe')) {
 android.sourceSets.main.assets.srcDir("$buildDir/generated/piperAssets")
 tasks.register('stagePiperSpanishVoice', Exec) {
  workingDir rootProject.projectDir
  commandLine 'python3', 'tools/stage_piper_android_voice.py'
 }
 tasks.named('preBuild').configure { dependsOn tasks.named('stagePiperSpanishVoice') }
}

