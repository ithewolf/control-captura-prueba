// Maven Central applies HTTP 429 limits to some shared CI egress addresses.
// JetBrains recommends using Google's hosted Maven Central mirror first:
// https://support.jetbrains.com/hc/en-us/articles/40043409905170
// Keep official Google and Gradle Plugin Portal repositories for Android plugins.
pluginManagement {
    repositories {
        google()
        maven { url = uri('https://maven-central-eu.storage-download.googleapis.com/maven2/') }
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url = uri('https://maven-central-eu.storage-download.googleapis.com/maven2/') }
        mavenCentral()
    }
}

rootProject.name = 'ControlCaptureProbe'
include ':app'
